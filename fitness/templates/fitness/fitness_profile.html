<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fitness Profile | RehabVision</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 0;
        }

        /* Top Navigation */

        .navbar {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
        }

        .logout {
            text-decoration: none;
            color: #dc2626;
            font-weight: bold;
        }

        .logout:hover {
            text-decoration: underline;
        }

        /* Main Container */

        .container {
            width: 700px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* Form */

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 80px;
        }

        /* Errors */

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 5px;
        }

        /* Button */

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>


<body>


<!-- Navigation Bar -->

<div class="navbar">

    <div class="logo">
        RehabVision
    </div>

    <a
        href="{% url 'accounts:logout' %}"
        class="logout"
    >
        Logout
    </a>

</div>


<!-- Fitness Profile -->

<div class="container">

    <h1>Fitness Profile</h1>

    <p class="subtitle">

        Tell us about yourself so RehabVision
        can personalize your fitness plan.

    </p>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">

            Continue

        </button>

    </form>

</div>


</body>

</html>
