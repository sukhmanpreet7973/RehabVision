<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Reminder | RehabVision</title>

    <style>

        /* =========================================================
           1. CSS CUSTOM PROPERTIES (VARIABLES)
        ========================================================= */

        :root {
            /* Color Palette */
            --bg-main: #0b1120;
            --bg-card: rgba(18, 28, 48, 0.7);
            --bg-card-inner: rgba(11, 17, 32, 0.6);
            
            --primary-emerald: #34d399;
            --primary-glow: rgba(52, 211, 153, 0.35);
            
            --text-bright: #f8fafc;
            --text-subtle: #a8b3c7;
            --text-muted: #64748b;
            
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(52, 211, 153, 0.5);

            /* Action / Danger Colors */
            --danger-bg: #ef4444;
            --danger-hover: #dc2626;
            --danger-glow: rgba(239, 68, 68, 0.35);

            /* Effects & Layout */
            --glass-blur: blur(16px);
            --radius-lg: 20px;
            --radius-md: 12px;
            --transition-fast: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* =========================================================
           2. GLOBAL RESET & BASE STYLES
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-bright);
            min-height: 100vh;
        }

        /* =========================================================
           3. HEADER
        ========================================================= */

        .header {
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-subtle);
            padding: 30px 8%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fca5a5 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(239, 68, 68, 0.25));
        }

        /* =========================================================
           4. MAIN CONTAINER & CARD
        ========================================================= */

        .container {
            width: 90%;
            max-width: 580px;
            margin: 60px auto;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                        0 0 30px -5px var(--danger-glow);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.4), transparent);
        }

        .icon {
            font-size: 52px;
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 4px 12px rgba(239, 68, 68, 0.3));
        }

        h2 {
            margin-bottom: 12px;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-bright);
        }

        .message {
            color: var(--text-subtle);
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 15px;
        }

        .reminder-name {
            font-weight: 800;
            color: var(--primary-emerald);
        }

        /* =========================================================
           5. BUTTONS
        ========================================================= */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        button,
        .cancel-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 24px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all var(--transition-fast);
        }

        .delete-button {
            background: linear-gradient(135deg, var(--danger-bg) 0%, var(--danger-hover) 100%);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
        }

        .delete-button:hover {
            background: linear-gradient(135deg, #f87171 0%, var(--danger-bg) 100%);
            box-shadow: 0 6px 24px rgba(239, 68, 68, 0.5);
            transform: translateY(-2px);
        }

        .cancel-button {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-subtle);
            color: var(--text-bright);
        }

        .cancel-button:hover {
            border-color: var(--border-glow);
            background: rgba(28, 41, 66, 0.9);
            transform: translateY(-2px);
        }

        /* =========================================================
           6. RESPONSIVE MEDIA QUERIES
        ========================================================= */

        @media (max-width: 600px) {
            .header {
                padding: 20px 16px;
            }

            .header h1 {
                font-size: 24px;
            }

            .container {
                margin: 30px auto;
            }

            .card {
                padding: 30px 20px;
            }

            .buttons {
                flex-direction: column;
                width: 100%;
            }

            button,
            .cancel-button,
            form {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="header">

    <h1>🔔 Delete Reminder</h1>

</div>


<div class="container">

    <div class="card">

        <div class="icon">
            🗑️
        </div>

        <h2>
            Delete this reminder?
        </h2>

        <p class="message">

            Are you sure you want to delete

            <span class="reminder-name">
                "{{ reminder.title }}"
            </span>

            ?

            <br>

            This action cannot be undone.

        </p>


        <div class="buttons">

            <form
                method="POST"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete-button"
                >
                    🗑️ Yes, Delete
                </button>

            </form>


            <a
                href="{% url 'reminders:reminder_dashboard' %}"
                class="cancel-button"
            >
                Cancel
            </a>

        </div>

    </div>

</div>

</body>
</html>
